<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TFTN</title>
    <link rel="stylesheet" href="./src/stil.css" />
  </head>
  <body>
    <header id="kopf">
      <span id="datei"><b id="projekt">…</b><span id="datei-rest"></span></span>
      <nav class="kopf-knoepfe" aria-label="Dokument">
        <button id="neu-knopf" data-ikone="neu" title="Neues Dokument: leer, aus einer Vorlage oder importiert"><span class="knopf-text">Neu</span></button>
        <button id="oeffnen-knopf" data-ikone="oeffnen" title="Projekt öffnen: Ordner wählen oder eines der zuletzt geöffneten (Cmd/Strg+O wählt gleich den Ordner)"><span class="knopf-text">Öffnen</span></button>
        <span class="trenn"></span>
        <button id="fassungen-knopf" data-ikone="fassungen" title="Frühere Fassungen ansehen und zurückholen"><span class="knopf-text">Fassungen</span></button>
        <button id="export-knopf" data-ikone="export" title="Export-Profile des Dokumenttyps"><span class="knopf-text">Export</span></button>
        <span class="trenn"></span>
        <button id="einstellungen-knopf" class="nur-ikone" data-ikone="zahnrad" aria-label="Einstellungen" title="Einstellungen und Tastenkürzel"></button>
        <button id="ueber-knopf" class="nur-ikone" data-ikone="hilfe" aria-label="Über TFTN" title="Über TFTN: Version, Links, Tastenkürzel"></button>
      </nav>
    </header>
    <div id="hinweis" role="status" hidden><span id="hinweis-text"></span><span id="hinweis-knoepfe"></span><button id="hinweis-zu" class="nur-ikone" data-ikone="schliessen" aria-label="Hinweis schließen" title="Hinweis schließen"></button></div>
    <main id="arbeit">
      <section id="links">
        <nav id="gliederung" aria-label="Gliederung"></nav>
        <div id="schreiben">
          <div id="editor-knoepfe">
            <button id="baustein-knopf" data-ikone="baustein" title="Baustein einfügen (Cmd/Strg+Umschalt+B; in einer Leerzeile auch „/“)"><span class="knopf-text">Baustein</span></button>
            <button id="zitat-knopf" data-ikone="zitat" title="Zitat einfügen (Cmd/Strg+Umschalt+L)"><span class="knopf-text">Zitat</span></button>
            <button id="gliederung-knopf" data-ikone="gliederung" title="Überschriften und Kommentare neben dem Text: hinspringen, Abschnitte verschieben"><span class="knopf-text">Gliederung</span></button>
            <button id="seite-knopf" data-ikone="seite" title="Format, Schrift und Sprache"><span class="knopf-text">Seite</span></button>
            <span class="trenn"></span>
            <button id="seitenleiste-knopf" class="nur-ikone" data-ikone="seitenleiste" aria-label="Seitenleiste" title="Seitenleiste"></button>
            <button id="schreibansicht-knopf" class="nur-ikone" data-ikone="schreibansicht" aria-label="Schreibansicht" title="Nur der Text, ohne Ablenkung"></button>
          </div>
          <div id="editor"></div>
        </div>
      </section>
      <section id="vorschau">
        <div id="banner" hidden></div>
        <div id="seiten"></div>
      </section>
    </main>
    <footer id="status"><span id="zaehler" title="Gezählt wird der geschriebene Text: ohne Befehle, Formeln, Code und Kommentare"></span><span id="sprache" title="Rechtschreibung nach Dokumentsprache; Rechtsklick auf ein unterwelltes Wort zeigt Vorschläge"></span><span id="sync"></span><span id="netz"></span><span id="mcp" hidden></span><span id="latenz"></span><span id="vorschau-zoom" role="group" aria-label="Zoom der Vorschau"><button id="zoom-breite" title="Seiten so breit wie die Vorschau">Breite</button><button id="zoom-seite" title="Ganze Seite auf einen Blick">Ganze Seite</button><button id="zoom-weniger" title="Verkleinern (Cmd/Strg + Mausrad)" aria-label="Verkleinern">−</button><button id="zoom-prozent" title="Echte Größe (100 %)">100 %</button><button id="zoom-mehr" title="Vergrößern (Cmd/Strg + Mausrad)" aria-label="Vergrößern">+</button></span></footer>
    <button id="schreibansicht-ende" title="Schreibansicht verlassen (Esc)">Schreibansicht verlassen</button>
    <script type="module" src="./src/start.ts"></script>
  </body>
</html>
