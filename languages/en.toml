"Der Schrift „{schrift}“ fehlt das Zeichen „{zeichen}“; es kommt aus „{ersatz}“ und sieht deshalb anders aus." = "The font “{schrift}” lacks the character “{zeichen}”; it is taken from “{ersatz}” and therefore looks different."
"Fehler" = "Error"
"Keine Schriften gefunden: Das Dokument hat keinen Ordner fonts/, und TFTN kennt keinen Schriftvorrat. Der Text bleibt unsichtbar. In der App „Schriften einbinden“ wählen." = "No fonts found: the document has no fonts/ folder and TFTN knows no font supply. The text stays invisible. In the app, choose “Embed fonts”."
"Warnung" = "Warning"

